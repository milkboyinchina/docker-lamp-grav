<VirtualHost *:80>
    # Set the primary server name
    ServerName milkboy.my.id
    ServerAlias www.milkboy.my.id 127.0.0.1 ::1
    
    # Dynamically reads SERVER_ADMIN passed from .env / Docker Compose
    ServerAdmin ${SERVER_ADMIN}
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirect www.milkboy.my.id to milkboy.my.id
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.milkboy\.my\.id$ [NC]
    RewriteRule ^(.*)$ http://milkboy.my.id$1 [R=301,L]

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>